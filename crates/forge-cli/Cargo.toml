[package]
name = "forge-cli"
version = "0.1.0"
edition = "2021"
description = "forge run <scenario.toml> — one command, one multi-agent loop"
license = "Apache-2.0"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-runtime = { path = "../forge-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
