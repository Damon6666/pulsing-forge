name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p forge-cli
      # 确定性场景即回归门: 全部出厂场景必须在无 LLM 环境下 PASS
      - run: |
          PASS=0; TOTAL=0
          for s in scenarios/*.toml; do
            TOTAL=$((TOTAL+1))
            if ./target/release/forge run "$s" | grep -q "state: PASS"; then
              PASS=$((PASS+1)); echo "✅ $s"
            else
              echo "❌ $s"; exit 1
            fi
          done
          echo "场景回归: $PASS/$TOTAL"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
